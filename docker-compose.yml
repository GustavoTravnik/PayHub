version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: payhub
      POSTGRES_PASSWORD: payhub_password
      POSTGRES_DB: payhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      - DATABASE_URL=postgresql://payhub:payhub_password@db:5432/payhub_db?schema=public
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker:dev
    environment:
      - DATABASE_URL=postgresql://payhub:payhub_password@db:5432/payhub_db?schema=public
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  redisdata:
